<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 358" width="1000" height="358" font-family="Arial,Helvetica,sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#555"/></marker></defs>
<rect width="1000" height="358" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Chatbot architecture with fallback branch</text>
<rect x="100.0" y="70" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="185.0" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">User message</text>
<text x="185.0" y="118" text-anchor="middle" font-size="12" fill="#555">text input</text>
<line x1="273.0" y1="102.0" x2="307.0" y2="102.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="310.0" y="70" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="395.0" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Preprocess</text>
<text x="395.0" y="118" text-anchor="middle" font-size="12" fill="#555">tokenize, lemmatize</text>
<line x1="483.0" y1="102.0" x2="517.0" y2="102.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="520.0" y="70" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="605.0" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Intent model</text>
<text x="605.0" y="118" text-anchor="middle" font-size="12" fill="#555">NN / LLM</text>
<line x1="693.0" y1="102.0" x2="727.0" y2="102.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="730.0" y="70" width="170" height="64" rx="10" fill="#e1ebfa" stroke="#2b6cd4" stroke-width="2"/>
<text x="815.0" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Confidence?</text>
<text x="815.0" y="118" text-anchor="middle" font-size="12" fill="#555">threshold 0.7</text>
<rect x="100.0" y="194" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="185.0" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">High</text>
<text x="185.0" y="242" text-anchor="middle" font-size="12" fill="#555">return intent response</text>
<line x1="273.0" y1="226.0" x2="307.0" y2="226.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="310.0" y="194" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="395.0" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Low</text>
<text x="395.0" y="242" text-anchor="middle" font-size="12" fill="#555">fallback: &quot;samajh nahi aaya&quot;</text>
<line x1="483.0" y1="226.0" x2="517.0" y2="226.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="520.0" y="194" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="605.0" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">LLM + RAG</text>
<text x="605.0" y="242" text-anchor="middle" font-size="12" fill="#555">optional: answer from docs</text>
<line x1="693.0" y1="226.0" x2="727.0" y2="226.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="730.0" y="194" width="170" height="64" rx="10" fill="#f7f7f5" stroke="#9a9a94" stroke-width="2"/>
<text x="815.0" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Log</text>
<text x="815.0" y="242" text-anchor="middle" font-size="12" fill="#555">track fallback rate</text>
<text x="500.0" y="340" text-anchor="middle" font-size="13" fill="#444">Evaluate with intent accuracy, fallback rate, relevance and latency.</text>
